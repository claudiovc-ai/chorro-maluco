<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chochoro Maluco</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#58d68d,#5dade2,#f7dc6f);min-height:100vh;overflow:hidden}
#app{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.screen{width:min(900px,100%);height:min(700px,96vh);background:rgba(255,255,255,.94);border:5px solid #fff;border-radius:30px;box-shadow:0 15px 45px #0004;overflow:hidden;position:relative}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.logo{font-size:clamp(42px,9vw,82px);font-weight:900;color:#ff6b35;text-shadow:4px 4px #ffd166;margin:0}
.subtitle{font-size:22px;color:#34495e;font-weight:bold}
.dog{width:180px;height:180px;object-fit:cover;border-radius:50%;border:8px solid #ffd166;box-shadow:0 8px 20px #0003}
button{border:0;border-radius:18px;padding:16px 30px;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #0002;transition:.12s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
#play{background:#ff6b35;color:#fff;min-width:220px}
#how{background:#48c9b0;color:#fff}
#game{display:none;background:#87ceeb}
.hud{height:70px;background:#ffffffdd;display:flex;align-items:center;justify-content:space-around;font-weight:900;font-size:20px;position:relative;z-index:3}
#field{position:absolute;left:0;right:0;top:70px;bottom:0;overflow:hidden;background:linear-gradient(#87ceeb 0 62%,#7bd35b 62% 100%)}
.cloud{position:absolute;font-size:60px;opacity:.8;animation:float 18s linear infinite}
@keyframes float{from{transform:translateX(-150px)}to{transform:translateX(1000px)}}
#player{position:absolute;width:105px;height:105px;object-fit:cover;border-radius:50%;border:5px solid #fff;box-shadow:0 7px 12px #0004;z-index:2;user-select:none;touch-action:none}
.item{position:absolute;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;z-index:2}
.bone{background:#fff;border:3px solid #d6d6d6}
.poop{background:#8e5a3c}
#message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:5}
.card{background:#fff;border-radius:25px;padding:30px;text-align:center;width:min(430px,90%);box-shadow:0 15px 40px #0005}
.card h2{font-size:40px;margin:0 0 10px;color:#ff6b35}
.card p{font-size:22px}
#restart{background:#ff6b35;color:#fff}
#back{background:#5dade2;color:#fff;margin-left:8px}
.controls{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
.pad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px;gap:5px;pointer-events:auto}
.pad button{padding:0;width:60px;height:60px;border-radius:15px;background:#ffffffcc;font-size:25px}
.hint{font-size:14px;color:#555}
</style>
</head>

<script>
const menu=document.getElementById('menu'), game=document.getElementById('game');
const field=document.getElementById('field'), player=document.getElementById('player');
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives'), levelEl=document.getElementById('level');
let score=0,lives=3,level=1,running=false,paused=false,items=[],keys={};
let x=350,y=330,speed=5,spawnTimer=0,audioCtx=null;

function music(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    let t=audioCtx.currentTime;
    const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46];
    notes.forEach((n,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(.035,t+i*.18);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.18+.16);o.connect(g);g.connect(audioCtx.destination);
      o.start(t+i*.18);o.stop(t+i*.18+.17);
    });
    setTimeout(music,1500);
  }catch(e){}
}

function start(){
  menu.style.display='none';game.style.display='block';
  score=0;lives=3;level=1;x=350;y=330;items=[];running=true;paused=false;
  scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level;
  document.querySelectorAll('.item').forEach(e=>e.remove());
  music(); requestAnimationFrame(loop);
}

function spawn(){
  const el=document.createElement('div');
  const good=Math.random()>.25;
  el.className='item '+(good?'bone':'poop');
  el.textContent=good?'🦴':'💩';
  el.dataset.good=good?'1':'0';
  el.style.left=(20+Math.random()*(field.clientWidth-80))+'px';
  el.style.top=(70+Math.random()*(field.clientHeight-150))+'px';
  field.appendChild(el);items.push(el);
}

function hit(a,b){
  const r1=a.getBoundingClientRect(),r2=b.getBoundingClientRect();
  return !(r1.right<r2.left||r1.left>r2.right||r1.bottom<r2.top||r1.top>r2.bottom);
}

function end(title,text){
  running=false;document.getElementById('endTitle').textContent=title;
  document.getElementById('endText').textContent=text+' Pontuação: '+score;
  document.getElementById('message').style.display='flex';
}

function loop(){
  if(!running)return;
  if(!paused){
    const maxX=field.clientWidth-player.clientWidth, maxY=field.clientHeight-player.clientHeight;
    if(keys.ArrowLeft||keys.a)x-=speed;
    if(keys.ArrowRight||keys.d)x+=speed;
    if(keys.ArrowUp||keys.w)y-=speed;
    if(keys.ArrowDown||keys.s)y+=speed;
    x=Math.max(0,Math.min(maxX,x));y=Math.max(0,Math.min(maxY,y));
    player.style.left=x+'px';player.style.top=y+'px';
    spawnTimer++;
    if(spawnTimer>Math.max(25,70-level*6)){spawn();spawnTimer=0}
    items=items.filter(el=>{
      if(hit(player,el)){
        const good=el.dataset.good==='1';
        if(good){score+=10; if(score%100===0){level++;levelEl.textContent=level}}
        else{lives--;livesEl.textContent=lives;if(lives<=0){el.remove();end('😵 O CHOCHORO CANSOU!','Você ficou sem vidas.')}}
        scoreEl.textContent=score;el.remove();return false;
      }
      return document.body.contains(el);
    });
  }
  requestAnimationFrame(loop);
}

document.getElementById('play').onclick=start;
document.getElementById('restart').onclick=()=>{document.getElementById('message').style.display='none';start()};
document.getElementById('back').onclick=()=>{running=false;game.style.display='none';menu.style.display='flex';document.getElementById('message').style.display='none'};
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'⏸'};
document.getElementById('how').onclick=()=>alert('Use as setas ou WASD para movimentar o Chochoro. Pegue 🦴 para ganhar pontos e evite 💩. A cada 100 pontos você avança de fase!');

window.addEventListener('keydown',e=>{keys[e.key]=true});
window.addEventListener('keyup',e=>{keys[e.key]=false});
document.querySelectorAll('[data-key]').forEach(b=>{
  const k={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.key];
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
  b.addEventListener('pointerup',()=>keys[k]=false);
  b.addEventListener('pointerleave',()=>keys[k]=false);
});
</script>
</body>
</html>
